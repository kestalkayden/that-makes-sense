// Loom 1.11 builds obfuscated 1.21.8 (guard-free) and has a plugin marker, so it applies via the
// normal plugins {} DSL — no legacy buildscript classpath hack (unlike the 1.21.1 branch's loom 1.7.4).
plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

// Shared code from ../common pulled into main. Unlike the 26.x branches, 1.21.1 does NOT split
// environment source sets: main is compiled against the merged (client+server) official-mapping
// jar, so the client-only config screen and the client-only mixins in the `client` array of
// thatmakessense.mixins.json compile here and are simply never loaded on a dedicated server.
sourceSets.main.java.srcDir "${rootProject.projectDir}/common/src/main/java"
sourceSets.main.java.srcDir "${rootProject.projectDir}/common/src/client/java"
// Fabric's own client entrypoints (ThatMakesSenseFabricClient, ModMenuIntegration) formerly lived in
// the split `client` source set; with no splitEnvironmentSourceSets() they must be pulled into main too.
sourceSets.main.java.srcDir "${projectDir}/src/client/java"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 1.21.1 is OBFUSCATED — map to Mojang's official names so common/ (written against official
    // names) compiles; loom generates the mixin refmap that remaps to intermediary at runtime.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Config UI - Mod Menu opens the hand-built native config screen. Not bundled.
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    mods {
        "thatmakessense" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client { runDir = "../run" }
        server { runDir = "../run" }
    }
}

processResources {
    inputs.property "version", project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('../shared-resources') {
        exclude '**/*.java'
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("../LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
