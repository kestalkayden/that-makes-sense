// Loom 1.7.4 is applied via the legacy buildscript classpath, not the `plugins {}` DSL.
// The Fabric maven only publishes plugin markers for loom 1.14.0+, and loom 1.14+ added a
// notObfuscated() guard that trips on obfuscated 1.21.1 (those builds target the 26.x
// non-obfuscated game). Loom 1.7.4 has no such guard and builds obfuscated 1.21.1 but ships
// no plugin marker, so we pull its main artifact directly on the buildscript classpath.
buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

base {
    archivesName = "${project.archives_base_name}-fabric"
}

// Shared code from ../common pulled into main. Unlike the 26.x branches, 1.21.1 does NOT split
// environment source sets: main is compiled against the merged (client+server) official-mapping
// jar, so the client-only config screen and the client-only mixins in the `client` array of
// thatmakessense.mixins.json compile here and are simply never loaded on a dedicated server.
sourceSets.main.java.srcDir "${rootProject.projectDir}/common/src/main/java"
sourceSets.main.java.srcDir "${rootProject.projectDir}/common/src/client/java"
// Fabric's own client entrypoints (ThatMakesSenseFabricClient, ModMenuIntegration) formerly lived in
// the split `client` source set; with no splitEnvironmentSourceSets() they must be pulled into main too.
sourceSets.main.java.srcDir "${projectDir}/src/client/java"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 1.21.1 is OBFUSCATED — map to Mojang's official names so common/ (written against official
    // names) compiles; loom generates the mixin refmap that remaps to intermediary at runtime.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Config UI - Mod Menu opens the hand-built native config screen. Not bundled. Sourced from
    // Modrinth (see the repository comment in the root build.gradle); same jar, same
    // `com.terraformersmc.modmenu.api` classes, so loom remaps it exactly as before.
    modImplementation "maven.modrinth:modmenu:${modmenu_version}"
}

loom {
    mods {
        "thatmakessense" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client { runDir = "../run" }
        server { runDir = "../run" }
    }
}

processResources {
    inputs.property "version", project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('../shared-resources') {
        exclude '**/*.java'
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("../LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
