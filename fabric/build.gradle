plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No `mappings` line - Minecraft 26.2 is deobfuscated and ships Mojang's official names.

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Config UI - Mod Menu opens the hand-built native config screen.
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "thatmakessense" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client { runDir = "../run" }
        server { runDir = "../run" }
    }
}

// Shared code from :common. splitEnvironmentSourceSets() keeps client-only code out of main, so the
// loader-agnostic config goes into main and the client-only config screen into client.
sourceSets.main.java.srcDir "${rootProject.projectDir}/common/src/main/java"
sourceSets.client.java.srcDir "${rootProject.projectDir}/common/src/client/java"

processResources {
    inputs.property "version", project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('../shared-resources') {
        exclude '**/*.java'
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from("../LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
