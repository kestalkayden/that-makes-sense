plugins {
    id 'java'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        maven { name = 'Fabric';    url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        // Mod Menu comes from Modrinth rather than maven.terraformersmc.com: that host has twice
        // blocked a release by answering 200 and then truncating the jar mid-body, which Gradle
        // surfaces as `Premature end of chunk coded message body`. Modrinth serves the identical
        // artifact. The content filter keeps every other dependency from ever querying it.
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        mavenCentral()
    }
}

allprojects {
    version = project.mod_version
    group = project.maven_group
}

tasks.register('buildAll') {
    dependsOn ':fabric:build', ':neoforge:build'
    description = 'Builds both Fabric and NeoForge versions.'
}
