plugins {
    id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
    archivesName = "${project.archives_base_name}-common"
}

// Purity gate. Compile BOTH shared source roots (main + client) against vanilla NeoForm-provided
// Minecraft - official Mojang names, client+server merged, with NO loader code on the classpath.
// This module ships nothing; its only job is to fail the build if shared code imports a Fabric or
// NeoForge class. The real jars come from :fabric and :neoforge, which pull these same sources in
// via `sourceSets ... srcDir` and compile them against each loader's own Minecraft view.
sourceSets.main.java.srcDir "src/client/java"

neoForge {
    neoFormVersion = "${neoform_version}"
    validateAccessTransformers = false
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
