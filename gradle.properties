# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft
minecraft_version=1.21.8

# Fabric
loader_version=0.18.4
# Loom 1.11: guard-free (no notObfuscated() gate) and builds OBFUSCATED 1.21.8; it has a plugin
# marker, so it applies via the normal plugins {} DSL (unlike loom 1.7.4 on the 1.21.1 branch).
loom_version=1.11-SNAPSHOT
fabric_version=0.129.0+1.21.8

# NeoForge
neoforge_version=21.8.53
moddev_version=2.0.141
# NeoForge build/publish gate - set false to hold off when NeoForged lags an MC version.
neoforge_enabled=true

# Config UI (Mod Menu opens the hand-built native config screen)
modmenu_version=15.0.2

# Mod
mod_version=0.2.2
maven_group=com.kestalkayden.thatmakessense
archives_base_name=thatmakessense
