# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft
minecraft_version=1.21.1

# Fabric
loader_version=0.18.4
# Loom 1.7.4: last guard-free loom that builds OBFUSCATED 1.21.1 (loom 1.14+ trip a
# notObfuscated() guard aimed at the 26.x non-obfuscated game). Applied via the legacy
# buildscript classpath in fabric/build.gradle (no plugin marker is published below 1.14).
loom_version=1.7.4
fabric_version=0.116.12+1.21.1

# NeoForge
neoforge_version=21.1.234
moddev_version=2.0.141
# NeoForge build/publish gate - set false to hold off when NeoForged lags an MC version.
neoforge_enabled=true

# Config UI (Mod Menu opens the hand-built native config screen)
modmenu_version=11.0.4

# Mod
mod_version=0.2.0
maven_group=com.kestalkayden.thatmakessense
archives_base_name=thatmakessense
