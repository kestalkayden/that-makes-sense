pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'thatmakessense'

// 'common' is not a subproject on 1.21.1 (unlike the 26.x branches' NeoForm purity gate) — its
// sources are pulled into each loader via srcDir (see fabric/build.gradle and neoforge/build.gradle).
include 'fabric'
include 'neoforge'
